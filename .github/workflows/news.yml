name: Naver News → Telegram

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: news-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check cron-job.org is alive
        # GitHub 자체 예약 실행 때만: cron-job.org 실행이 2시간 넘게 없으면 텔레그램 알림
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if [ -z "$ADMIN_CHAT_ID" ]; then exit 0; fi
          last=$(gh api "repos/${REPO}/actions/workflows/news.yml/runs?event=workflow_dispatch&per_page=1" --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then age=999999; else age=$(( $(date +%s) - $(date -d "$last" +%s) )); fi
          echo "마지막 cron-job.org 실행: ${last:-없음} (${age}초 전)"
          if [ "$age" -gt 7200 ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
              --data-urlencode "text=⏰ cron-job.org 실행이 $((age / 3600))시간 넘게 없어요
          cron-job.org에서 작업이 Inactive인지, HISTORY에 401 오류가 있는지 확인해 주세요."
          fi
      - name: Fetch news & send
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_monitor.py
      - name: Save sent history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_links.json
          git diff --cached --quiet || git commit -m "update sent links"
          git pull --rebase origin main || git rebase --abort
          git push
      - name: Alert on failure
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ADMIN_CHAT_ID" ]; then echo "TELEGRAM_ADMIN_CHAT_ID 없음 - 알림 생략"; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${ADMIN_CHAT_ID}" \
            --data-urlencode "text=⚠️ 뉴스 모니터 오류 발생
          로그 확인: ${RUN_URL}"
